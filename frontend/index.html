<!doctype html>
<html lang="en">
  <head>

    <!-- Prevent React Virtual DOM crash when Google Translate wraps text nodes -->
    <script>
      if (typeof Node === 'function' && Node.prototype) {
        const origRemove = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) return child;
          return origRemove.apply(this, arguments);
        };
        const origInsert = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, refNode) {
          if (refNode && refNode.parentNode !== this) return newNode;
          return origInsert.apply(this, arguments);
        };
      }
    </script>


    <!-- Protect all icon font ligatures from being translated into words -->
    <script>
      (function() {
        const protect = () => {
          document.querySelectorAll('.material-symbols-outlined, .material-symbols, .material-icons, [class*="material-"]').forEach(el => {
            el.setAttribute('translate', 'no');
            el.classList.add('notranslate');
          });
        };
        protect();
        if (window.MutationObserver) {
          new MutationObserver(protect).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JalSetu Civic Intelligence Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  
    <!-- Protect all SVG charts and callout lines from Google Translate DOM injection -->
    <script>
      (function() {
        const protectSvg = () => {
          document.querySelectorAll('svg, .recharts-wrapper, .recharts-surface, .recharts-pie').forEach(el => {
            el.setAttribute('translate', 'no');
            el.classList.add('notranslate');
          });
        };
        protectSvg();
        if (window.MutationObserver) {
          new MutationObserver(protectSvg).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,mr,ta,te,bn,gu,kn,pa,ml,or',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  </body>
</html>
